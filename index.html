      // Compatibility patch for browser/iframe environments where fetch has only a getter
      (function() {
        try {
          var origFetch = window.fetch;
          var boundFetch = origFetch ? origFetch.bind(window) : undefined;
          var currentFetch = boundFetch;

          // Define getter/setter on Window.prototype if available
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (!desc || desc.configurable !== false) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return currentFetch; },
                  set: function(v) { currentFetch = v; },
                  configurable: true,
                  enumerable: true
                });
              }
            }
          } catch (_) {}

          // Define getter/setter directly on window
          try {
            var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!winDesc || winDesc.configurable !== false) {
              Object.defineProperty(window, 'fetch', {
                get: function() { return currentFetch; },
                set: function(v) { currentFetch = v; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}

          // Define getter/setter on globalThis if distinct
          try {
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              var gDesc = Object.getOwnPropertyDescriptor(globalThis, 'fetch');
              if (!gDesc || gDesc.configurable !== false) {
                Object.defineProperty(globalThis, 'fetch', {
                  get: function() { return currentFetch; },
                  set: function(v) { currentFetch = v; },
                  configurable: true,
                  enumerable: true
                });
              }
            }
          } catch (_) {}
        } catch (e) {
          console.warn('Fetch setter compatibility patch failed:', e);
        }
      })();
    </script>
